# Pushing a version tag (v0.2.0) builds the Windows installer and publishes it as a GitHub
# release. Installed copies find it there and update themselves (electron-updater, ADR 0015).
name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The tag is the version: the installer, the updater feed and /api/health all read it.
      - name: Set the version from the tag
        shell: bash
        run: npm pkg set version="${GITHUB_REF_NAME#v}" --workspaces --include-workspace-root
      - run: npm run typecheck
      - run: npm test
      # Made here, once: left to electron-builder, its parallel uploads each made their own
      # release for the tag, and the updater read the one without latest.yml (v0.2.0, v0.2.1).
      - name: Create the release
        shell: bash
        run: gh release create "$GITHUB_REF_NAME" --title "${GITHUB_REF_NAME#v}" --verify-tag --notes ""
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Build the installer and publish the release
        run: npm run desktop:release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # A copy without the version in its name, so the landing site's /download page can always link
      # releases/latest/download/Pocket-Money-Pal-Setup.exe. The updater still reads latest.yml and the
      # versioned file, which stay as they are.
      - name: Upload the installer under a fixed name
        shell: bash
        run: |
          cp "apps/desktop/release/Pocket-Money-Pal-Setup-${GITHUB_REF_NAME#v}.exe" Pocket-Money-Pal-Setup.exe
          gh release upload "$GITHUB_REF_NAME" Pocket-Money-Pal-Setup.exe --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
